<!DOCTYPE html>
<!-- `shell` is the PAGE SHAPE: this page has a menu, and the shell's rules — the
     rail the content reserves, the drawer, the veil — belong to it. A page
     without a menu simply does not declare the shape, and none of it reaches it
     (base.css, section 5). -->
<html class="shell">
<head>
<meta charset="utf-8">
<!-- `viewport-fit=cover` is the EDGE-TO-EDGE page: the window stretches under
     the system bars, and `base.css` pays the notches back with
     `env(safe-area-inset-*)`. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The canvas of the default `at` theme, the value before any choice runs.
     `js/boot.js` rewrites it before the first paint with the canvas of the
     theme and side that are really active. -->
<meta name="theme-color" content="#f6f1ff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1233">
<title>AT</title>
<!-- O PWA de verdade (TASK-162, fatia 2/2): o manifesto é o que deixa
     "instalar" fazer sentido, e o Service Worker (main.ts) é quem responde
     com o avião ligado — os dois de raiz, e nenhum dos dois bundlado pelo
     Vite (por isso fora do marcador do look abaixo, que é só CSS e o boot.js). -->
<link rel="manifest" href="/manifest.webmanifest">
<!-- O ÍCONE DE INSTALAÇÃO. O manifesto carrega os PNG que o Chrome exige para
     oferecer "Instalar app" (192 e 512); este é o do iOS, que não lê o
     manifesto e pega a imagem por aqui. Ambos são do mesmo logo (`icons/`). -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- O FAVICON da aba: o mesmo logo do PWA, em PNG quadrado. -->
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<!-- AT'S LOOK, and it comes from the SERVER, on the same origin: the
     THEME, then the choice (before the first paint), then the BASE.

     Injected by `vite.config.ts` on purpose, and not written here: Vite treats
     `<link rel="stylesheet">` as something to BUNDLE, and when it does not find
     the file on disk it REMOVES it — which is what happened to the base
     stylesheet in the first build, in silence. -->
<!--at:look-->
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>

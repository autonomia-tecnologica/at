[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "at"
description = "A deterministic task engine that bootstraps its own environment"
dynamic = ["version"]
requires-python = ">=3.14.7"
# The product's one runtime dependency: the binding of `libsodium`, which the
# hashed field's derivation needs (§4, item 8). The version is named here and in
# `requirements.txt`, with the hashing; a test fails when the two drift.
dependencies = ["PyNaCl==1.6.2"]

# Two artifacts and two entry points (§3, item 27): `at` is the folder and the
# app, and `at-deploy` is §7 whole — the environment, the switch and the only
# elevation in the product. `at` imports nothing of `at_deploy`, and the
# suite affirms it.
[project.scripts]
at = "at.ui.cli:main"
at-deploy = "at_deploy.cli:main"

# The version has one home: `at.__version__`, and both artifacts wear it.
# There is one release, and it publishes both files.
[tool.setuptools.dynamic]
version = { attr = "at.__version__" }

[tool.setuptools.packages.find]
include = ["at*"]
exclude = ["at.tests*", "at_deploy.tests*"]

# Three payloads are data, not code, and all of them are invisible to an import
# graph: without them the built artifact ships no `blocks/*.json` (every surface
# answers in raw keys), no `defaults/*.json` (the first run seeds no system
# table) and no `vocabulary/*.json` (the interpreter names nothing a person
# says). The WebApp's `assets/`, `dist/` and `vendor/` are collected by
# `at.spec` instead, because they must stay out of a wheel: `dist/` is derived,
# and the three together are what the single binary carries (§3).
[tool.setuptools.package-data]
"at.i18n" = ["blocks/*.json", "vocabulary/*.json"]
"at.data" = ["defaults/*.json"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bill"
description = "A deterministic task engine that bootstraps its own environment"
dynamic = ["version"]
requires-python = ">=3.14.7"
# The skeleton is stdlib only. A dependency arrives pinned in version and
# hashing (§3, Dependência externa) — starting at zero is the
# cheapest way to keep that promise.
dependencies = []

[project.scripts]
bill = "bill.ui.cli:main"

# The version has one home: `bill.__version__`.
[tool.setuptools.dynamic]
version = { attr = "bill.__version__" }

[tool.setuptools.packages.find]
include = ["bill*"]
exclude = ["bill.tests*"]

# Two payloads are data, not code, and both are invisible to an import graph:
# without them the built artifact ships no `blocks/*.json` (every surface answers
# in raw keys) and no `defaults/*.json` (the first run seeds no system table).
# The WebApp's `assets/`, `dist/` and `vendor/` are collected by `bill.spec`
# instead, because they must stay out of a wheel: `dist/` is derived, and the
# three together are what the single binary carries (§3).
[tool.setuptools.package-data]
"bill.i18n" = ["blocks/*.json"]
"bill.data" = ["defaults/*.json"]
